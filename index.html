<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Random Voice Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <!-- ফ্রি গ্লোবাল ভয়েস কানেক্টর লাইব্রেরি -->
    <script src="https://unpkg.com"></script>

    <!-- 💰 আপনার ওয়েবসাইটের Monetag ফ্রি বিজ্ঞাপনের কোড (ইনকাম শুরু করার জন্য) -->
    <script>(function(s,u,z,p,v,e,d){v=s.createElement(u);v.async=1;v.src=z+p;e=s.getElementsByTagName(u)[0];e.parentNode.insertBefore(v,e);})(document,'script','https://cheororpt.com);</script>
</head>
<body>
    <div class="chat-container">
        <h1>Welcome to Random Voice Chat</h1>
        <p>Talk to strangers anonymously worldwide</p>
        
        <div class="live-users">124 Users Online</div>

        <div class="status-box">
            <span id="status">Ready to connect...</span>
        </div>

        <button id="start-btn">Start Random Call</button>
        <button id="disconnect-btn" style="display: none; background-color: #dc3545;">Disconnect</button>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('start-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const statusText = document.getElementById('status');

        let localStream;
        let myPeer;
        let currentCall;

        startBtn.addEventListener('click', async () => {
            statusText.innerText = "Accessing microphone...";
            startBtn.disabled = true;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                statusText.innerText = "Connecting to voice cloud...";
                
                // সম্পূর্ণ ফ্রিতে পিয়ার কানেকশন তৈরি করা হচ্ছে
                myPeer = new Peer();
                
                myPeer.on('open', (id) => {
                    statusText.innerText = "Searching for a partner...";
                    socket.emit('find_partner');
                });

                // কেউ কল দিলে রিসিভ করার কোড
                myPeer.on('call', (call) => {
                    call.answer(localStream);
                    currentCall = call;
                    statusText.innerText = "Connected! Talk now.";
                    startBtn.style.display = "none";
                    disconnectBtn.style.display = "block";

                    call.on('stream', (remoteStream) => {
                        playRemoteAudio(remoteStream);
                    });
                });

            } catch (err) {
                statusText.innerText = "Microphone access denied!";
                startBtn.disabled = false;
            }
        });

        disconnectBtn.addEventListener('click', () => {
            if (currentCall) currentCall.close();
            if (myPeer) myPeer.destroy();
            location.reload();
        });

        socket.on('match_found', (data) => {
            statusText.innerText = "Calling stranger...";
            startBtn.style.display = "none";
            disconnectBtn.style.display = "block";

            if (data.initiate) {
                // পার্টনারকে সরাসরি ভয়েস কল দেওয়া
                const call = myPeer.call(data.partnerId, localStream);
                currentCall = call;

                call.on('stream', (remoteStream) => {
                    statusText.innerText = "Connected! Talk now.";
                    playRemoteAudio(remoteStream);
                });
            }
        });

        socket.on('waiting', (msg) => {
            statusText.innerText = msg;
        });

        function playRemoteAudio(stream) {
            let audio = document.getElementById('remote-audio');
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = 'remote-audio';
                document.body.appendChild(audio);
            }
            audio.srcObject = stream;
            audio.autoplay = true;
        }
    </script>
</body>
</html>
