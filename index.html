<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Random Voice Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="chat-container">
        <h1>Welcome to Random Voice Chat</h1>
        <p>Talk to strangers anonymously worldwide</p>
        
        <div class="status-box">
            <span id="status">Ready to connect...</span>
        </div>

        <!-- দৃশ্যমান অডিও প্লেয়ার যা ব্রাউজারকে সাউন্ড প্লে করতে বাধ্য করবে -->
        <div id="audio-container" style="margin: 15px 0;">
            <audio id="remote-audio" autoplay controls style="display: none; width: 100%;"></audio>
        </div>

        <button id="start-btn">Start Random Call</button>
        <button id="disconnect-btn" style="background-color: #dc3545; display: none; margin-top: 10px;">Disconnect</button>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('start-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const statusText = document.getElementById('status');
        const remoteAudio = document.getElementById('remote-audio');

        let localStream;
        let peerConnection;
        let partnerSocketId;
        
             const config = {
            iceServers: [
                { urls: 'stun:://google.com' },
                { urls: 'stun:://google.com' },
                { urls: 'stun:://google.com' },
                { urls: 'stun:://twilio.com' }
            ]
        };


        startBtn.addEventListener('click', async () => {
            statusText.innerText = "Accessing microphone...";
            startBtn.disabled = true;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                statusText.innerText = "Searching for a partner...";
                socket.emit('find_partner');
            } catch (err) {
                statusText.innerText = "Microphone access denied!";
                startBtn.disabled = false;
                console.error(err);
            }
        });

        disconnectBtn.addEventListener('click', () => {
            location.reload(); // কল কাটলে পেজ রিফ্রেশ হয়ে নতুন কলের জন্য রেডি হবে
        });

        socket.on('waiting', (msg) => {
            statusText.innerText = msg;
        });

        socket.on('match_found', async (data) => {
            statusText.innerText = "Connected! Talk now.";
            startBtn.style.display = "none";
            disconnectBtn.style.display = "block";
            partnerSocketId = data.partnerId;
            
            peerConnection = new RTCPeerConnection(config);
            
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                // সরাসরি আমাদের দৃশ্যমান স্পিকার বক্সে পার্টনারের ভয়েস যুক্ত করা হচ্ছে
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.style.display = "block"; // স্পিকারটি স্ক্রিনে দেখাবে
                
                // ব্রাউজার ব্লক করলে জোরপূর্বক প্লে করার চেষ্টা
                remoteAudio.play().catch(e => {
                    statusText.innerText = "Click anywhere on screen to unmute voice!";
                    document.body.addEventListener('click', () => {
                        remoteAudio.play();
                        statusText.innerText = "Connected! Talk now.";
                    }, { once: true });
                });
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice_candidate', { target: partnerSocketId, candidate: event.candidate });
                }
            };

            if (data.initiate) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { target: partnerSocketId, offer: offer });
            }
        });

        socket.on('offer', async (data) => {
            if(!peerConnection) return;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { target: data.sender, answer: answer });
        });

        socket.on('answer', async (data) => {
            if(!peerConnection) return;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice_candidate', async (data) => {
            if(!peerConnection) return;
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (e) {
                console.error("Error adding ice candidate", e);
            }
        });
    </script>
</body>
</html>
