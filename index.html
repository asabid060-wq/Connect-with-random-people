<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Random Voice Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="chat-container">
        <h1>Welcome to Random Voice Chat</h1>
        <p>Talk to strangers anonymously worldwide</p>
        
        <!-- ইংরেজি ইউজার কাউন্টার -->
        <div class="live-users">124 Users Online</div>

        <div class="status-box">
            <span id="status">Ready to connect...</span>
        </div>

        <!-- ম্যানুয়াল কন্ট্রোলসহ বাস্তব স্পিকার বক্স -->
        <div id="speaker-box" style="margin: 20px 0; display: none;">
            <i class="fas fa-volume-up" style="font-size: 40px; color: #00ff88; margin-bottom: 10px;"></i>
            <p style="margin-bottom: 10px; color: #00ff88; font-weight: bold;">Speaker Stream Active</p>
            <!-- ভলিউম ও প্লে বাটনসহ দৃশ্যমান অডিও প্লেয়ার -->
            <audio id="remote-audio" autoplay controls style="width: 100%; max-width: 250px; margin: 0 auto; display: block;"></audio>
        </div>

        <button id="start-btn">Start Random Call</button>
        <button id="disconnect-btn" style="display: none;">Disconnect</button>
    </div>

    <script>
        const socket = io();
        const startBtn = document.getElementById('start-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const statusText = document.getElementById('status');
        const speakerBox = document.getElementById('speaker-box');
        const remoteAudio = document.getElementById('remote-audio');

        let localStream;
        let peerConnection;
        let partnerSocketId;
        
        const config = {
            iceServers: [
                { urls: 'stun:://google.com' },
                { urls: 'stun:://google.com' },
                { 
                    urls: 'turn:global.relay.metered.ca:443',
                    username: '601e3b5ca7f4c01d4ca6b864',
                    credential: 'uO/8pXhKUn6GfWhU'
                },
                {
                    urls: 'turn:global.relay.metered.ca:80',
                    username: '601e3b5ca7f4c01d4ca6b864',
                    credential: 'uO/8pXhKUn6GfWhU'
                }
            ]
        };

        startBtn.addEventListener('click', async () => {
            statusText.innerText = "Accessing microphone...";
            startBtn.disabled = true;

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                statusText.innerText = "Searching for a partner...";
                socket.emit('find_partner');
            } catch (err) {
                statusText.innerText = "Microphone access denied!";
                startBtn.disabled = false;
                console.error(err);
            }
        });

        disconnectBtn.addEventListener('click', () => {
            location.reload();
        });

        socket.on('waiting', (msg) => {
            statusText.innerText = msg;
        });

        socket.on('match_found', async (data) => {
            statusText.innerText = "Connected! Click PLAY on the speaker.";
            startBtn.style.display = "none";
            disconnectBtn.style.display = "block";
            speakerBox.style.display = "block";
            partnerSocketId = data.partnerId;
            
            peerConnection = new RTCPeerConnection(config);
            
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteAudio.srcObject = event.streams;
                
                // জোরপূর্বক প্লে করার চেষ্টা, ব্যর্থ হলে ইউজারকে প্লে বাটনে ক্লিক করতে বলা হবে
                remoteAudio.play().catch(error => {
                    statusText.innerText = "Click the PLAY button on the speaker bar!";
                });
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice_candidate', { target: partnerSocketId, candidate: event.candidate });
                }
            };

            if (data.initiate) {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('offer', { target: partnerSocketId, offer: offer });
            }
        });

        socket.on('offer', async (data) => {
            if(!peerConnection) return;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { target: data.sender, answer: answer });
        });

        socket.on('answer', async (data) => {
            if(!peerConnection) return;
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice_candidate', async (data) => {
            if(!peerConnection) return;
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            } catch (e) {
                console.error("Error adding ice candidate", e);
            }
        });
    </script>
</body>
</html>
